<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parquet Viewer</title>
    <link rel="stylesheet" href="src/viewer.css">
  </head>
  <body>
    <header id="grid-toolbar">
      <div class="tabs" role="group" aria-label="Parquet view">
        <button id="rows" aria-pressed="true" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 4h14v12H3z M3 8h14 M7 8v8"/></svg>Rows</button>
        <button id="schema" aria-pressed="false" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 3h5v4H3z M5 7v7h6 M5 10h6 M11 8h6v4h-6z M11 14h6v3h-6z"/></svg>Schema</button>
      </div>
      <div id="pager">
        <button id="previous" aria-label="Previous page" title="Previous page" disabled>‹</button>
        <button id="position" aria-live="polite" title="Page size and navigation" aria-haspopup="menu" aria-controls="page-size-menu" aria-expanded="false" disabled></button>
        <span id="page-total"></span>
        <div id="page-size-menu" role="menu" aria-label="Rows per page" hidden></div>
        <button id="next" aria-label="Next page" title="Next page" disabled>›</button>
      </div>
      <div class="tool-group">
        <button class="icon-action" id="find-page" title="Find on current page" aria-label="Find on page" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M12.5 7.5a5 5 0 1 1-10 0 5 5 0 1 1 10 0 M11 11l5 5"/></svg></button>
        <button class="icon-action" id="chart" title="Show or hide chart" aria-label="Chart" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 3v13h14 M6 12l3-4 3 2 4-6"/></svg></button>
        <button class="icon-action" id="query" title="Open SQL editor" aria-label="Query" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 5l5 5-5 5 M10 15h7"/></svg></button>
      </div>
      <div class="tool-group right-tools">
        <details id="analysis-menu" class="tool-menu">
          <summary title="Analysis views" aria-label="Analysis views"><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 15V9 M8 15V4 M13 15V7 M16 9l2 2 2-2"/></svg><span id="analysis-name">Analyze</span></summary>
          <div class="tool-popover">
            <button id="explore" disabled>Explore</button>
            <button id="profile" disabled>Profile</button>
            <button id="relationships" disabled>Relationships</button>
          </div>
        </details>
<button class="icon-action" id="export" title="Export…" aria-label="Export…" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M10 2v9 M6.5 7.5L10 11l3.5-3.5 M3 12v4h14v-4"/></svg></button><button class="icon-action" id="compare" title="Compare" aria-label="Compare" disabled><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3 3h6v13H3z M12 5h5v12h-5z"/></svg></button>
        <span id="columns-control"></span>
        <details id="options" class="tool-menu">
          <summary title="View options" aria-label="View options"><svg class="tool-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M4 10h.2 M10 10h.2 M16 10h.2"/></svg></summary>
          <div class="tool-popover">
            <label>View rows as<select id="row-format"><option value="table">Table</option><option value="tree">Tree</option><option value="text">Text</option></select></label>
            <button id="transpose" aria-pressed="false">Transpose</button>
            <button id="reload-file">Reload file</button>
            <button id="full-chart">Open chart in full view</button>
            <span id="metadata"></span>
          </div>
        </details>
      </div>
    </header>
    <div id="grid-state" hidden><span id="grid-scope"></span><button id="grid-clear">Reset filters and sort</button><button id="grid-page" hidden>Use current page</button></div>
    <div id="page-search" hidden role="search">
      <input id="page-search-text" type="search" aria-label="Find on current page" placeholder="Find on current page">
      <span id="match-count" role="status"></span>
      <button id="match-prev" aria-label="Previous match">‹</button><button id="match-next" aria-label="Next match">›</button>
      <button id="search-close" aria-label="Close search">×</button>
    </div>
    <form id="query-form" hidden>
      <div class="query-controls" id="recipes"></div>
      <label for="sql">SQL using <code>parquet_data</code></label>
      <textarea id="sql" rows="4" spellcheck="false" maxlength="65536">SELECT * FROM parquet_data LIMIT 100</textarea>
      <div class="query-controls">
        <button type="submit" id="run">Run with DuckDB</button>
        <button type="button" id="summary">Summarize columns</button>
        <span id="query-status" role="status"></span>
      </div>
    </form>
    <div id="workspace">
      <main id="content" aria-busy="true">
        <p role="status">Reading Parquet metadata…</p>
      </main>
      <section class="analysis-panel" id="explore-panel" aria-label="Explore" hidden></section>
      <section class="analysis-panel" id="profile-panel" aria-label="Profile" hidden></section>
      <section class="analysis-panel" id="relationships-panel" aria-label="Relationships" hidden></section>
      <aside id="record" aria-labelledby="record-title" hidden>
        <div class="panel-toolbar">
          <h2 id="record-title"></h2>
          <button id="record-previous" aria-label="Previous record">‹</button>
          <button id="record-next" aria-label="Next record">›</button>
          <button id="record-close">Close</button>
        </div>
        <dl id="record-values"></dl>
      </aside>
      <section id="chart-panel" aria-label="Chart" hidden>
        <div class="plot-area">
          <div class="chart-toolbar">
            <div id="chart-type" role="group" aria-label="Chart type">
              <button type="button" value="bar" aria-label="Category counts" title="Category counts" aria-pressed="true">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14h12M4 11V7m4 4V3m4 8V5"/></svg>
              </button>
              <button type="button" value="line" aria-label="Time series" title="Time series" aria-pressed="false">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m2 12 4-5 3 3 5-6"/></svg>
              </button>
              <button type="button" value="area" aria-label="Time series area" title="Time series area" aria-pressed="false">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m2 12 4-5 3 3 5-6v9H2Z" fill="currentColor" fill-opacity=".25"/></svg>
              </button>
              <button type="button" value="scatter" aria-label="Scatter plot" title="Scatter plot" aria-pressed="false">
                <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="3" cy="11" r="1.35"/><circle cx="7" cy="7" r="1.35"/><circle cx="10" cy="10" r="1.35"/><circle cx="13" cy="4" r="1.35"/></svg>
              </button>
              <button type="button" value="histogram" aria-label="Histogram" title="Histogram" aria-pressed="false">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13V9h4V4h4v3h4v6ZM6 9v4m4-6v6"/></svg>
              </button>
              <button type="button" value="pie" aria-label="Category shares" title="Category shares" aria-pressed="false">
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2v6h6"/></svg>
              </button>
            </div>
            <button type="button" id="chart-png" disabled>Save PNG…</button>
          </div>
          <p id="chart-status" role="status">Choose a column to plot.</p>
          <div id="plot"></div>
        </div>
        <form id="chart-form" aria-label="Chart settings">
          <button type="submit" id="chart-run">Plot</button>
          <fieldset id="chart-settings">
            <details open>
              <summary>Series Settings</summary>
              <div class="chart-settings-body">
                <label class="chart-column"><span id="chart-x-label">X axis</span><select id="chart-x" required></select></label>
                <label class="chart-column" id="chart-group-field" hidden>Groups<select id="chart-group"></select></label>
                <div id="chart-y-field" hidden>
                  <span>Y axis</span>
                  <div id="chart-y-series"></div>
                  <button type="button" id="chart-add-series">+ Add series</button>
                </div>
                <label class="chart-column" id="chart-bins-field" hidden>Bins<input id="chart-bins" type="number" min="2" max="100" value="20"></label>
                <div id="chart-line-style" hidden>
                  <label><input id="chart-stepped" type="checkbox"> Stepped</label>
                  <label><input id="chart-points" type="checkbox"> Show points</label>
                </div>
              </div>
            </details>
          </fieldset>
        </form>
      </section>
    </div>
    <dialog id="export-dialog" aria-labelledby="export-title">
      <form id="export-form" class="panel-options">
        <h2 id="export-title">Export data</h2>
        <label>Rows
          <select id="export-scope">
            <option value="visible">Displayed rows</option>
            <option value="file">Entire file (DuckDB)</option>
            <option value="query">All rows from last query (DuckDB)</option>
          </select>
        </label>
        <label>Format
          <select id="export-format" disabled>
            <option value="csv">CSV</option>
            <option value="parquet">Parquet</option>
          </select>
        </label>
        <p id="export-status" role="status"></p>
        <div class="panel-toolbar">
          <button type="button" id="export-cancel">Cancel</button>
          <button type="submit" id="export-run">Save…</button>
        </div>
      </form>
    </dialog>
    <dialog id="compare-dialog" aria-labelledby="compare-title">
      <form id="compare-form" class="panel-options">
        <h2 id="compare-title">Compare Parquet files</h2>
        <label>Compare
          <select id="compare-mode"><option value="rows">Schema or rows</option><option value="profile">Column distributions</option></select>
        </label>
        <label id="distribution-field" hidden>Column<select id="distribution-column"></select></label>
        <label id="compare-key-field">Match rows by
          <select id="compare-key"><option value="">Compare schemas only</option></select>
        </label>
        <p id="key-hint">Choose a column that is unique and non-null in both files to compare rows.</p>
        <p id="compare-status" role="status"></p>
        <div class="panel-toolbar">
          <button type="button" id="compare-cancel">Cancel</button>
          <button type="submit" id="compare-run">Choose file…</button>
        </div>
      </form>
    </dialog>
    <dialog id="go-dialog" aria-labelledby="go-title">
      <form id="go-form" class="panel-options">
        <h2 id="go-title"></h2>
        <label><span id="page-input-label"></span><input id="page-input" type="number" step="1" min="1" required></label>
        <div class="panel-toolbar"><button id="go-cancel" type="button">Cancel</button><button id="page-confirm" type="submit">OK</button></div>
      </form>
    </dialog>
    <dialog id="cell">
      <h2 id="column-name"></h2>
      <pre id="value"></pre>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
