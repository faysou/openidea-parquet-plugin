[package]
name = "openidea-parquet-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "d80aeb6e9ec85275bf8f7845e218d81a14a90136" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
