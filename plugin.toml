id = "faysou.parquet-viewer"
name = "Parquet Viewer"
version = "0.1.2"
description = "Browse Parquet rows, column types, and file metadata without loading the whole file."
license = "MIT OR Apache-2.0"
authors = ["Faysal Aberkane <faysal.aberkane@gmail.com>"]
categories = ["tools"]
engines.openidea = "^1.16"
wasm = "dist/plugin.wasm"
activation = ["on-view:parquet"]

[capabilities]
optional = ["process:duckdb"]

[[contributes.customEditors]]
id = "parquet"
title = "Parquet"
patterns = ["*.parquet"]
web = "web/index.html"
binary = true
