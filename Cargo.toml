[package]
name = "openidea-parquet-plugin"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Faysal Aberkane <faysal.aberkane@gmail.com>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
openidea-plugin = { git = "https://github.com/faysou/openidea", rev = "b7fa5ae5301d2d1e580421ae12659d4cb0c09bf0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
